name: Bug report
description: Something does not work in a guest
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most of what we learn comes from hardware and driver combinations we
        cannot rent. A report that says *"it failed"* costs us a round trip;
        one with the four fields below is usually diagnosable on sight.

        **Please check whether the host does the same thing first.** Six
        apparent nvkvm bugs have turned out to reproduce identically on bare
        metal — if your workload also fails outside the guest, the bug is not
        here, and knowing that saves us both a day.

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: >
        Run `scripts/nvkvm-report.sh` and paste the output — on the host, and
        in the guest too if it gets that far. It reads only; it changes
        nothing. Read it before you paste it: it names your kernel, GPU and
        driver versions.
      value: |
        # on the HOST
        ./scripts/nvkvm-report.sh

        # in the GUEST (if it boots)
        ./scripts/nvkvm-report.sh

        # if you cannot run the script, these four lines are the minimum:
        nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
        cat /proc/driver/nvidia/version
        uname -r ; . /etc/os-release ; echo "$PRETTY_NAME"
      render: shell
    validations:
      required: true

  - type: textarea
    id: validate
    attributes:
      label: tests/validate.sh output
      description: >
        Run `bash tests/validate.sh` inside the guest and paste the whole thing,
        including the TOTAL/VERDICT line. If it never got far enough to run,
        say so and paste what did happen instead.
      render: shell
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >
        What you ran, what you expected, what you got. Error messages verbatim.
        If QEMU printed anything on stderr, that is usually the most useful part
        of the whole report.
    validations:
      required: true

  - type: textarea
    id: qemu-stderr
    attributes:
      label: QEMU stderr
      description: >
        `docker compose logs vmm | tail -200`, or the terminal you launched
        QEMU in. This is the single most useful field in the form and the one
        most often missing — nvkvm reports things here that appear in no other
        log. Worth pasting even when everything seemed to work: lines like
        `nvkvm: KVM_RUN EFAULT cleared after N ms` are absorbed faults we would
        like to know the frequency of.
      render: shell

  - type: textarea
    id: host-check
    attributes:
      label: Does it happen on the host too?
      description: >
        The same binary, run outside the guest. "Not tested" is an acceptable
        answer — it is just much less useful than either "yes" or "no".
    validations:
      required: true
