# nvkvm-xorg.conf — installed as /etc/X11/xorg.conf inside the guest, so a stock
# distro boots into its OWN Xorg session on the nvkvm KMS head.
#
# scripts/stage_guest_libs.sh installs this for you, with BusID rewritten to the
# address nvkvm's PCI device actually has in your guest; there is nothing to copy
# by hand.  Set NVKVM_STAGE_XORG=0 to skip it.  Keep the string
# "nvkvm-xorg.conf" on the first line: that is the marker the script matches to
# tell its own file apart from one you wrote, and it will never overwrite one it
# does not recognise.
#
# WHY A FILE IS NEEDED AT ALL
# ---------------------------
# Two drivers can claim nvkvm's DRM device and, left alone, a stock install
# picks whichever of them cannot work:
#
#   * The NVIDIA DDX.  The driver package ships an OutputClass matching
#     MatchDriver "nvidia-drm", which is the name nvkvm's guest DRM device
#     reports, so a stock install with the NVIDIA driver selects it.  It gets
#     all the way through RM and then fails at NVKMS display-subsystem
#     selection -- nvkvm denies the first NVKMS command it issues, because that
#     command reaches the HOST's real display engine.  See
#     docs/internal/mint-guest-desktop.md.
#
#   * modesetting with its default glamor acceleration.  glamor's
#     scanout-pixmap import is eglCreateImageKHR(EGL_NATIVE_PIXMAP_KHR, gbm_bo),
#     which NVIDIA's proprietary EGL rejects with EGL_BAD_PARAMETER -- on bare
#     metal too, for every modifier including LINEAR (tests/repro/gbm_egl_import.c).
#
# AccelMethod "none" takes the third path and it works: the X screen is
# composited on the CPU, while GL clients render on the GPU through NVIDIA's own
# GLX vendor library.  Run those clients with:
#
#     __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia <app>
#
# which is the same pair of variables a PRIME laptop uses.  Measured in-guest on
# an RTX 3070: glxgears ~2400 FPS on NVIDIA vs ~490 FPS on llvmpipe.
#
# This file does NOT require removing the distro's 10-nvidia.conf.  An explicit
# Device section outranks OutputClass driver selection, so Xorg applies only the
# vendor snippet's *options* and this file's Driver wins.
#
# BusID must name nvkvm's device.  scripts/run_test_vm.sh puts it at slot 7
# (0000:00:07.0 -> "PCI:0:7:0"), which is what this file ships with; the staging
# script rewrites it from the guest's own PCI tree, so it is right even if you
# changed addr=.  Note the bases differ -- a BDF is hex and BusID is decimal, so
# 0000:00:1f.0 is "PCI:0:31:0".  Check with `lspci -nn | grep NVIDIA` in the
# guest if you are editing this by hand.

Section "ServerLayout"
    Identifier     "nvkvm"
    Screen      0  "nvkvm-screen"
EndSection

Section "Device"
    Identifier     "nvkvm-device"
    Driver         "modesetting"
    BusID          "PCI:0:7:0"
    Option         "AccelMethod" "none"
EndSection

Section "Screen"
    Identifier     "nvkvm-screen"
    Device         "nvkvm-device"
EndSection
