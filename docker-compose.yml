# nvkvm in a container.  See the Dockerfile header and the README FAQ.
#
#   docker compose pull && docker compose up    # the published image
#   docker compose up --build                   # or build QEMU here instead
#   ssh -p 2222 ubuntu@127.0.0.1                # into the guest, once it has booted
services:
  nvkvm:
    # Both, on purpose.  `image:` names the published artifact so `pull` works
    # and nobody has to build QEMU to try this; `build:` keeps `--build`
    # working for anyone changing src/ -- and the tag is what the release
    # workflow pushes, so the two are the same thing built two ways.
    # No `latest` tag is published until the first non-prerelease.  Check
    # https://github.com/reindertpelsma/nvkvm-pv/releases for a newer tag.
    image: ghcr.io/reindertpelsma/nvkvm-pv:v0.2.0
    build: .
    # Capabilities: drop everything, then add back only what the isolate needs
    # to reach its STRONGEST sandbox rung.  This is not the same as dropping
    # everything -- `cap_drop: [ALL]` alone makes nvkvm WEAKER, not safer:
    # NVKVM_ISOLATE_MODE=auto probes the ladder by attempting each rung, and
    # without these four it silently falls back from uid+chroot to seccomp-only,
    # which is no uid separation and no chroot (src/qemu/nvkvm_isolate.c).
    #
    #   SETUID/SETGID  per-VM uid separation -- each isolate runs as its own uid
    #   SETPCAP        drop the bounding set before the uid drop
    #   SYS_CHROOT     the chroot("/dev") confinement
    #
    # Everything else in Docker's ~14-cap default goes: NET_RAW, MKNOD, CHOWN,
    # FOWNER, FSETID, KILL, NET_BIND_SERVICE, SYS_CHROOT's neighbours, and the
    # rest.  A VMM needs none of them once it holds /dev/kvm and the GPU nodes.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SETPCAP
      - SYS_CHROOT
    # The stub sets no_new_privs on itself and its seccomp TSYNC filter requires
    # it, so this matches what the process already does rather than fighting it.
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/kvm
    # GPU forwarding needs the NVIDIA container runtime -- the compose spelling
    # of `--gpus all`.  Drop this block to boot the VM without a GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              # What these actually gate, read from libnvidia-container source
              # rather than from the docs.  Capabilities select LIBRARIES, and
              # -- at two places only -- DEVICE NODES.  Devices are what matter.
              #
              #   (none)    /dev/nvidiactl and /dev/nvidia0..N need NO capability
              #             at all.  nvidiactl survives both filters and the
              #             per-GPU nodes never reach them (device_mount_native,
              #             nvc_mount.c:594-627, has no capability test).  That
              #             is already the whole RM ioctl surface.
              #   compute   the ONLY gate on /dev/nvidia-uvm (nvc_mount.c:783).
              #             QEMU opens UVM directly, so this is non-negotiable.
              #   display   the ONLY gate on /dev/nvidia-modeset (nvc_mount.c:786),
              #             and it implies `graphics` (options.h:90).  NVKMS is
              #             NOT scanout-only: the allowlist in
              #             nvkvm_nvkms_allowlist.h was captured from a Vulkan/EGL
              #             session, so dropping this while keeping `graphics`
              #             gives a half-working graphics stack, not a headless one.
              #   graphics  gates no device in libnvidia-container.  /dev/dri/*
              #             comes from the toolkit's graphics modifier, on
              #             `graphics` OR `display`.
              #   utility   gates no device.  It is the only entry here that
              #             grants host access nvkvm never uses: the persistenced
              #             and fabricmanager daemon sockets (nvc_mount.c:769-771).
              #             Kept because libnvidia-ml and nvidia-smi ride the same
              #             flag and make_host_bundle.sh requires them.
              #   video     gates NOTHING but library names (nvc_info.c:785), and
              #             implies compute anyway (options.h:89).  Security-
              #             cosmetic; keep it only for NVENC/NVDEC in the guest.
              #   gpu       not a driver capability -- Docker filters it out
              #             before the toolkit sees it.  Selects the nvidia
              #             device driver; grants nothing.
              #
              # Every grant is `c <major>:<minor> rw` -- read+write, never mknod
              # -- on cgroup v1 (cgroup_legacy.c:84) and v2 alike (eBPF
              # BPF_CGROUP_DEVICE).  So the container cannot mknod its way to a
              # node it was not granted.
              #
              # None of this is a privilege boundary against container root:
              # /dev/nvidia* are mode 0666 on the host, so a container-root
              # process has the same reach as any unprivileged local user.  The
              # guest is what is confined, by the allowlists in src/qemu/.
              #
              # COMPUTE ONLY?  [gpu, utility, compute] is the minimal set, with
              # graphics=off on the device and NVKVM_GRAPHICS=0 in the module.
              # No modeset device, no render node, no display code in the .ko.
              capabilities: [gpu, utility, compute, graphics, display, video]
    environment:
      # Guest sizing, same defaults as scripts/run_test_vm.sh.  Raise VM_MEM
      # for LLM work -- a model that does not fit is disk-bound, not slow.
      VM_MEM: ${VM_MEM:-16G}
      VM_SMP: ${VM_SMP:-4}
      # Bring your own guest image (any cloud-init capable Linux; only the
      # default Ubuntu 24.04 is tested).
      NVKVM_GUEST_IMAGE_URL: ${NVKVM_GUEST_IMAGE_URL:-}
    volumes:
      # The 20 GB guest disk lives here so it survives an image rebuild.
      - nvkvm-guest:/opt/nvkvm-guest
      # Shared folder, visible inside the guest at /data.
      - ./data:/data
    # Bound to loopback on purpose: the guest's SSH should not be reachable
    # from the network just because the container is running.
    ports:
      - "127.0.0.1:2222:2222"
    stdin_open: true    # -serial stdio: keep the guest console attached
    tty: true

volumes:
  nvkvm-guest:
