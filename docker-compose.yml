# nvkvm in a container.  See the Dockerfile header and the README FAQ.
#
#   docker compose pull && docker compose up    # the published image
#   docker compose up --build                   # or build QEMU here instead
#   ssh -p 2222 ubuntu@127.0.0.1                # into the guest, once it has booted
services:
  nvkvm:
    # Both, on purpose.  `image:` names the published artifact so `pull` works
    # and nobody has to build QEMU to try this; `build:` keeps `--build`
    # working for anyone changing src/ -- and the tag is what the release
    # workflow pushes, so the two are the same thing built two ways.
    # No `latest` tag is published until the first non-prerelease.  Check
    # https://github.com/reindertpelsma/nvkvm-pv/releases for a newer tag.
    image: ghcr.io/reindertpelsma/nvkvm-pv:v0.0.1-rc2
    build: .
    # Capabilities: drop everything, then add back only what the isolate needs
    # to reach its STRONGEST sandbox rung.  This is not the same as dropping
    # everything -- `cap_drop: [ALL]` alone makes nvkvm WEAKER, not safer:
    # NVKVM_ISOLATE_MODE=auto probes the ladder by attempting each rung, and
    # without these four it silently falls back from uid+chroot to seccomp-only,
    # which is no uid separation and no chroot (src/qemu/nvkvm_isolate.c).
    #
    #   SETUID/SETGID  per-VM uid separation -- each isolate runs as its own uid
    #   SETPCAP        drop the bounding set before the uid drop
    #   SYS_CHROOT     the chroot("/dev") confinement
    #
    # Everything else in Docker's ~14-cap default goes: NET_RAW, MKNOD, CHOWN,
    # FOWNER, FSETID, KILL, NET_BIND_SERVICE, SYS_CHROOT's neighbours, and the
    # rest.  A VMM needs none of them once it holds /dev/kvm and the GPU nodes.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SETPCAP
      - SYS_CHROOT
    # The stub sets no_new_privs on itself and its seccomp TSYNC filter requires
    # it, so this matches what the process already does rather than fighting it.
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/kvm
    # GPU forwarding needs the NVIDIA container runtime -- the compose spelling
    # of `--gpus all`.  Drop this block to boot the VM without a GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              # `graphics` is what makes the GL and Vulkan libraries appear
              # in the container; without it the guest gets a compute-only
              # driver and Vulkan silently falls back to llvmpipe.
              #
              # `display` is NOT just libraries, and it is worth being explicit
              # about what it grants: the NVIDIA container toolkit mounts
              # /dev/nvidia-modeset for it -- the host's NVKMS config device,
              # the modesetting interface.  nvkvm needs it because the display
              # path forwards NVKMS (surface registration, vblank) to reach a
              # scanout at all.  It is also exactly the device
              # src/qemu/nvkvm_nvkms_allowlist.h gates: NVKMS is default-deny
              # on the inner cmdType, admitting only device alloc/free, surface
              # register/unregister and the vblank-semaphore ops, keyed on the
              # driver version -- because the command enum is unvalued and
              # NVIDIA renumbers it mid-branch.  Without that gate a guest
              # could reach GRANT_SURFACE or SET_FLIPLOCK_GROUP on a
              # host-global display engine.
              #
              # RUNNING COMPUTE ONLY?  Drop `display` and `graphics`, and pair
              # it with graphics=off on the device and NVKVM_GRAPHICS=0 in the
              # guest module.  That leaves no modesetting device in the
              # container and no display code in the .ko.
              capabilities: [gpu, utility, compute, graphics, display, video]
    environment:
      # Guest sizing, same defaults as scripts/run_test_vm.sh.  Raise VM_MEM
      # for LLM work -- a model that does not fit is disk-bound, not slow.
      VM_MEM: ${VM_MEM:-16G}
      VM_SMP: ${VM_SMP:-4}
      # Bring your own guest image (any cloud-init capable Linux; only the
      # default Ubuntu 24.04 is tested).
      NVKVM_GUEST_IMAGE_URL: ${NVKVM_GUEST_IMAGE_URL:-}
    volumes:
      # The 20 GB guest disk lives here so it survives an image rebuild.
      - nvkvm-guest:/opt/nvkvm-guest
      # Shared folder, visible inside the guest at /data.
      - ./data:/data
    # Bound to loopback on purpose: the guest's SSH should not be reachable
    # from the network just because the container is running.
    ports:
      - "127.0.0.1:2222:2222"
    stdin_open: true    # -serial stdio: keep the guest console attached
    tty: true

volumes:
  nvkvm-guest:
